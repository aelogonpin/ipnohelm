name: Publish Helm Chart to GHCR (OCI Registry)

on:
  push:
    tags:
      - 'v*'
      - '*'

jobs:
  publish-oci:
    name: Package and Push OCI Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and Push Helm Chart
        run: |
          mkdir -p .dist
          # Usa la versión del Tag si existe (reemplazando la 'v' inicial)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ -n "$TAG_VERSION" ]; then
            echo "Empaquetando chart con versión de Tag: $TAG_VERSION"
            helm package charts/app-of-apps --version "$TAG_VERSION" --app-version "$TAG_VERSION" -d .dist
          else
            helm package charts/app-of-apps -d .dist
          fi
          PACKAGE_FILE=$(ls .dist/app-of-apps-*.tgz)
          echo "Empaquetado $PACKAGE_FILE. Subiendo a GHCR..."
          helm push "$PACKAGE_FILE" "oci://ghcr.io/${{ github.repository_owner }}/charts"
