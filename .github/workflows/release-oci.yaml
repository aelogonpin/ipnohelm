name: Publish Helm Chart to GHCR (OCI Registry)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'charts/app-of-apps/**'
      - '.github/workflows/release-oci.yaml'

jobs:
  publish-oci:
    name: Package and Push OCI Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and Push Helm Chart
        run: |
          mkdir -p .dist
          helm package charts/app-of-apps -d .dist
          PACKAGE_FILE=$(ls .dist/app-of-apps-*.tgz)
          echo "Empaquetado $PACKAGE_FILE. Subiendo a GHCR..."
          helm push "$PACKAGE_FILE" "oci://ghcr.io/${{ github.repository_owner }}/charts"
